<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Resepsionis</title>
    <!-- Tailwind CSS v3 Play CDN (Lebih stabil dan tidak mudah berantakan) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tesseract.js CDN -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-3">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-5 my-4">
        
        <h1 class="text-xl font-bold text-center text-slate-800 mb-1">Resepsionis Check-In / Out</h1>
        <p class="text-center text-slate-500 text-xs mb-5">Sistem Pendataan Tamu Berbasis Kamera</p>

        <!-- Tombol Pilihan Mode -->
        <div class="flex bg-slate-200 p-1 rounded-xl mb-5">
            <button type="button" id="btnCheckin" onclick="switchMode('checkin')" 
                class="flex-1 py-2 rounded-lg font-semibold text-xs transition bg-blue-600 text-white shadow">
                Check-In (Masuk)
            </button>
            <button type="button" id="btnCheckout" onclick="switchMode('checkout')" 
                class="flex-1 py-2 rounded-lg font-semibold text-xs transition text-slate-600">
                Check-Out (Keluar)
            </button>
        </div>

        <!-- Area Notifikasi Pesan -->
        <div id="alertBox" class="hidden p-3 mb-4 rounded-xl text-xs text-center font-medium"></div>

        <!-- Form Utama -->
        <form id="receptionForm" onsubmit="handleSubmit(event)" class="space-y-3">
            
            <!-- Pilihan Jenis Identitas -->
            <div id="idTypeContainer">
                <label class="block text-xs font-semibold text-slate-700 mb-1">Jenis Kartu Pengenal</label>
                <select id="idType" class="w-full rounded-xl border border-slate-300 p-2.5 text-xs bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="KTP">KTP (NIK 16 Digit)</option>
                    <option value="SIM">SIM / Identitas Lain</option>
                    <option value="PELAJAR">Kartu Pelajar</option>
                </select>
            </div>

            <!-- Bagian Kamera -->
            <div class="border-2 border-dashed border-slate-300 rounded-xl p-3 text-center bg-slate-50">
                <label class="block text-xs font-semibold text-slate-700 mb-2">Scan Kartu Pengenal via Kamera</label>
                
                <div id="cameraContainer" class="relative w-full bg-black rounded-lg overflow-hidden mb-2 hidden flex justify-center items-center">
                    <video id="videoElement" autoplay playsinline class="w-full h-40 object-cover"></video>
                </div>

                <canvas id="canvasElement" class="hidden"></canvas>

                <div id="previewContainer" class="mb-2 hidden">
                    <img id="imagePreview" class="mx-auto h-32 object-contain rounded-lg border border-slate-200" alt="Pratinjau"/>
                </div>

                <div class="flex gap-2 justify-center">
                    <button type="button" id="startCamBtn" onclick="startCamera()" class="px-3 py-2 bg-slate-800 text-white text-xs font-semibold rounded-lg hover:bg-slate-700 transition">
                        Buka Kamera
                    </button>
                    <button type="button" id="captureBtn" onclick="capturePhoto()" class="px-3 py-2 bg-emerald-600 text-white text-xs font-semibold rounded-lg hover:bg-emerald-700 transition hidden">
                        Jepret & Scan NIK
                    </button>
                    <button type="button" id="retakeBtn" onclick="resetCamera()" class="px-3 py-2 bg-amber-600 text-white text-xs font-semibold rounded-lg hover:bg-amber-700 transition hidden">
                        Ulangi Foto
                    </button>
                </div>
            </div>

            <!-- Input Nomor Identitas -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Nomor Identitas / NIK</label>
                <input type="text" id="nik" required placeholder="Otomatis terisi saat scan..."
                    class="w-full rounded-xl border border-slate-300 p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>

            <!-- Field Tambahan (Check-In) -->
            <div id="checkinFields" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="nama" placeholder="Ketik nama lengkap tamu..."
                        class="w-full rounded-xl border border-slate-300 p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nomor Handphone</label>
                    <input type="tel" id="noHp" placeholder="Contoh: 08123456789"
                        class="w-full rounded-xl border border-slate-300 p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Alamat / Asal Instansi</label>
                    <input type="text" id="alamat" placeholder="Ketik alamat atau instansi..."
                        class="w-full rounded-xl border border-slate-300 p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Keperluan / Bertemu Siapa</label>
                    <textarea id="keperluan" rows="2" placeholder="Tuliskan keperluan kunjungan..."
                        class="w-full rounded-xl border border-slate-300 p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3 px-4 rounded-xl text-white font-bold shadow-md transition bg-blue-600 hover:bg-blue-700 text-xs">
                Simpan & Check-In
            </button>

        </form>

    </div>

    <!-- Script Logika -->
    <script>
        const SCRIPT_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnS5dGduhyEaGVCygRWKo9oSfrVa7setfs8qoao-vZ_ODBVsNRhuNx88GOPYuwBFLSuZqTtNFlCniD0q-9pkrKlts18NgwFdDpj2MG9jbHtHAu1dwHkz9jPX6PndbJxodyq3tAX1D1HOSV991kZsDk6ra-rU0UBI0vaklUXdwfQhtdkRWgPHqLmFQJ9bpKQSvHof8ShFpPpjr_hCZQDxa2lfmUxYscmzXErA6DFQUSGD7rZTpD_c-vvlTC7t9KXmjmX3jsQ_rrAUAlnhkcI5ZIJPGd21SQ&lib=MBNIcXTvPE8GSR91brAW9-xz2aiC72MHv";

        let currentMode = 'checkin';
        let mediaStream = null;

        function switchMode(mode) {
            currentMode = mode;
            const btnCheckin = document.getElementById('btnCheckin');
            const btnCheckout = document.getElementById('btnCheckout');
            const checkinFields = document.getElementById('checkinFields');
            const idTypeContainer = document.getElementById('idTypeContainer');
            const submitBtn = document.getElementById('submitBtn');
            
            hideAlert();
            clearForm();
            stopCamera();

            if (mode === 'checkin') {
                btnCheckin.className = "flex-1 py-2 rounded-lg font-semibold text-xs transition bg-blue-600 text-white shadow";
                btnCheckout.className = "flex-1 py-2 rounded-lg font-semibold text-xs transition text-slate-600";
                checkinFields.style.display = "block";
                idTypeContainer.style.display = "block";
                document.getElementById('nama').required = true;
                document.getElementById('noHp').required = true;
                submitBtn.innerText = "Simpan & Check-In";
                submitBtn.className = "w-full py-3 px-4 rounded-xl text-white font-bold shadow-md transition bg-blue-600 hover:bg-blue-700 text-xs";
            } else {
                btnCheckout.className = "flex-1 py-2 rounded-lg font-semibold text-xs transition bg-rose-600 text-white shadow";
                btnCheckin.className = "flex-1 py-2 rounded-lg font-semibold text-xs transition text-slate-600";
                checkinFields.style.display = "none";
                idTypeContainer.style.display = "none";
                document.getElementById('nama').required = false;
                document.getElementById('noHp').required = false;
                submitBtn.innerText = "Proses Check-Out";
                submitBtn.className = "w-full py-3 px-4 rounded-xl text-white font-bold shadow-md transition bg-rose-600 hover:bg-rose-700 text-xs";
            }
        }

        async function startCamera() {
            const video = document.getElementById('videoElement');
            const cameraContainer = document.getElementById('cameraContainer');
            const startCamBtn = document.getElementById('startCamBtn');
            const captureBtn = document.getElementById('captureBtn');
            const previewContainer = document.getElementById('previewContainer');

            try {
                previewContainer.classList.add('hidden');
                cameraContainer.classList.remove('hidden');
                
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });
                video.srcObject = mediaStream;
                
                startCamBtn.classList.add('hidden');
                captureBtn.classList.remove('hidden');
            } catch (error) {
                console.error("Gagal kamera:", error);
                showAlert("Tidak dapat mengakses kamera.", "error");
            }
        }

        function capturePhoto() {
            const video = document.getElementById('videoElement');
            const canvas = document.getElementById('canvasElement');
            const cameraContainer = document.getElementById('cameraContainer');
            const previewContainer = document.getElementById('previewContainer');
            const imagePreview = document.getElementById('imagePreview');
            const captureBtn = document.getElementById('captureBtn');
            const retakeBtn = document.getElementById('retakeBtn');

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageDataUrl = canvas.toDataURL('image/jpeg');
            imagePreview.src = imageDataUrl;

            cameraContainer.classList.add('hidden');
            previewContainer.classList.remove('hidden');
            captureBtn.classList.add('hidden');
            retakeBtn.classList.remove('hidden');

            stopCamera();
            processOCR(imageDataUrl);
        }

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        function resetCamera() {
            document.getElementById('previewContainer').classList.add('hidden');
            document.getElementById('retakeBtn').classList.add('hidden');
            document.getElementById('startCamBtn').classList.remove('hidden');
            document.getElementById('nik').value = "";
        }

        async function processOCR(imageSource) {
            showAlert("Memindai NIK dari kartu...", "info");
            const idType = document.getElementById('idType').value;

            try {
                const { data: { text } } = await Tesseract.recognize(imageSource, 'ind');
                console.log("OCR Result:", text);

                let detectedNumber = "";
                if (idType === 'KTP') {
                    const match = text.match(/\d{16}/);
                    if (match) detectedNumber = match[0];
                } else {
                    const match = text.match(/\d{10,16}/);
                    if (match) detectedNumber = match[0];
                }

                if (detectedNumber) {
                    document.getElementById('nik').value = detectedNumber;
                    showAlert("NIK berhasil terbaca! Silakan lengkapi nama & data lainnya.", "success");
                } else {
                    showAlert("NIK tidak ditemukan otomatis. Silakan ketik manual.", "error");
                }

            } catch (error) {
                console.error("OCR Error:", error);
                showAlert("Gagal memindai teks. Silakan isi manual.", "error");
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Menyimpan...";

            let payload = {};
            const idType = document.getElementById('idType').value;

            if (currentMode === 'checkin') {
                payload = {
                    action: "checkin",
                    waktuCheckIn: new Date().toLocaleTimeString(),
                    nik: `[${idType}] ` + document.getElementById('nik').value,
                    nama: document.getElementById('nama').value,
                    noHp: document.getElementById('noHp').value,
                    alamat: document.getElementById('alamat').value,
                    keperluan: document.getElementById('keperluan').value
                };
            } else {
                payload = {
                    action: "checkout",
                    nik: document.getElementById('nik').value
                };
            }

            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                showAlert("Data berhasil disimpan!", "success");
                clearForm();
                resetCamera();
            } catch (error) {
                console.error("Error:", error);
                showAlert("Terjadi kesalahan jaringan.", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = currentMode === 'checkin' ? "Simpan & Check-In" : "Proses Check-Out";
            }
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.remove('hidden');
            if (type === 'success') {
                alertBox.className = "p-3 mb-4 rounded-xl text-xs text-center font-medium bg-emerald-50 text-emerald-700 border border-emerald-200";
            } else if (type === 'error') {
                alertBox.className = "p-3 mb-4 rounded-xl text-xs text-center font-medium bg-rose-50 text-rose-700 border border-rose-200";
            } else {
                alertBox.className = "p-3 mb-4 rounded-xl text-xs text-center font-medium bg-sky-50 text-sky-700 border border-sky-200";
            }
            alertBox.innerText = message;
        }

        function hideAlert() {
            document.getElementById('alertBox').classList.add('hidden');
        }

        function clearForm() {
            document.getElementById('receptionForm').reset();
        }
    </script>
</body>
</html>
