<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Resepsionis - OCR Cerdas (Tesseract.js)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tesseract.js CDN -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl bg-white rounded-xl shadow-lg p-6 md:p-8">
        
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-1">Resepsionis Check-In / Out</h1>
        <p class="text-center text-gray-500 text-sm mb-6">Sistem Pendataan Tamu Berbasis Kamera & OCR Lokal</p>

        <!-- Tombol Pilihan Mode -->
        <div class="flex bg-gray-200 p-1 rounded-lg mb-6">
            <button type="button" id="btnCheckin" onclick="switchMode('checkin')" 
                class="flex-1 py-2 rounded-md font-semibold text-sm transition bg-blue-600 text-white shadow">
                Check-In (Masuk)
            </button>
            <button type="button" id="btnCheckout" onclick="switchMode('checkout')" 
                class="flex-1 py-2 rounded-md font-semibold text-sm transition text-gray-600">
                Check-Out (Keluar)
            </button>
        </div>

        <!-- Area Notifikasi Pesan -->
        <div id="alertBox" class="hidden p-3 mb-4 rounded-lg text-sm text-center font-medium"></div>

        <!-- Form Utama -->
        <form id="receptionForm" onsubmit="handleSubmit(event)" class="space-y-4">
            
            <!-- Pilihan Jenis Identitas -->
            <div id="idTypeContainer">
                <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Kartu Pengenal</label>
                <select id="idType" class="mt-1 block w-full rounded-md border border-gray-300 p-2 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm">
                    <option value="KTP">KTP (NIK 16 Digit)</option>
                    <option value="SIM">SIM / Kartu Identitas Lain</option>
                    <option value="PELAJAR">Kartu Pelajar / Mahasiswa</option>
                </select>
            </div>

            <!-- Bagian Kamera Langsung -->
            <div class="border-2 border-gray-300 rounded-lg p-4 text-center bg-gray-50">
                <label class="block text-sm font-medium text-gray-700 mb-2">Ambil Foto Kartu Pengenal via Kamera</label>
                
                <div id="cameraContainer" class="relative w-full bg-black rounded-lg overflow-hidden mb-2 hidden flex justify-center items-center">
                    <video id="videoElement" autoplay playsinline class="w-full h-48 object-cover"></video>
                </div>

                <canvas id="canvasElement" class="hidden"></canvas>

                <div id="previewContainer" class="mb-3 hidden">
                    <img id="imagePreview" class="mx-auto h-40 object-contain rounded border border-gray-300" alt="Pratinjau Kartu"/>
                </div>

                <div class="flex gap-2 justify-center">
                    <button type="button" id="startCamBtn" onclick="startCamera()" class="px-4 py-2 bg-gray-700 text-white text-xs font-semibold rounded hover:bg-gray-800 transition">
                        Buka Kamera
                    </button>
                    <button type="button" id="captureBtn" onclick="capturePhoto()" class="px-4 py-2 bg-green-600 text-white text-xs font-semibold rounded hover:bg-green-700 transition hidden">
                        Jepret & Scan OCR
                    </button>
                    <button type="button" id="retakeBtn" onclick="resetCamera()" class="px-4 py-2 bg-yellow-600 text-white text-xs font-semibold rounded hover:bg-yellow-700 transition hidden">
                        Ulangi Foto
                    </button>
                </div>
            </div>

            <!-- Input Nomor Identitas -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Nomor Identitas / NIK</label>
                <input type="text" id="nik" required placeholder="Nomor akan otomatis muncul..."
                    class="mt-1 block w-full rounded-md border border-gray-300 p-2 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm"/>
            </div>

            <!-- Field Tambahan (Check-In) -->
            <div id="checkinFields" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nama Lengkap (Hasil Ekstraksi / Koreksi Manual)</label>
                    <input type="text" id="nama" placeholder="Nama lengkap tamu..."
                        class="mt-1 block w-full rounded-md border border-gray-300 p-2 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm"/>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Nomor Handphone</label>
                    <input type="tel" id="noHp" placeholder="Contoh: 08123456789"
                        class="mt-1 block w-full rounded-md border border-gray-300 p-2 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm"/>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Alamat / Instansi / Asal Sekolah</label>
                    <input type="text" id="alamat" placeholder="Alamat atau asal instansi..."
                        class="mt-1 block w-full rounded-md border border-gray-300 p-2 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm"/>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Keperluan / Bertemu Siapa</label>
                    <textarea id="keperluan" rows="2" placeholder="Tuliskan keperluan kunjungan..."
                        class="mt-1 block w-full rounded-md border border-gray-300 p-2 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm"></textarea>
                </div>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3 px-4 rounded-md text-white font-semibold shadow transition bg-blue-600 hover:bg-blue-700 text-sm">
                Simpan & Check-In
            </button>

        </form>

    </div>

    <!-- Script Logika OCR Lanjutan -->
    <script>
        // ⚠️ Ganti dengan URL Web App Google Apps Script kamu!
        const SCRIPT_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnS5dGduhyEaGVCygRWKo9oSfrVa7setfs8qoao-vZ_ODBVsNRhuNx88GOPYuwBFLSuZqTtNFlCniD0q-9pkrKlts18NgwFdDpj2MG9jbHtHAu1dwHkz9jPX6PndbJxodyq3tAX1D1HOSV991kZsDk6ra-rU0UBI0vaklUXdwfQhtdkRWgPHqLmFQJ9bpKQSvHof8ShFpPpjr_hCZQDxa2lfmUxYscmzXErA6DFQUSGD7rZTpD_c-vvlTC7t9KXmjmX3jsQ_rrAUAlnhkcI5ZIJPGd21SQ&lib=MBNIcXTvPE8GSR91brAW9-xz2aiC72MHv";

        let currentMode = 'checkin';
        let mediaStream = null;

        function switchMode(mode) {
            currentMode = mode;
            const btnCheckin = document.getElementById('btnCheckin');
            const btnCheckout = document.getElementById('btnCheckout');
            const checkinFields = document.getElementById('checkinFields');
            const idTypeContainer = document.getElementById('idTypeContainer');
            const submitBtn = document.getElementById('submitBtn');
            
            hideAlert();
            clearForm();
            stopCamera();

            if (mode === 'checkin') {
                btnCheckin.className = "flex-1 py-2 rounded-md font-semibold text-sm transition bg-blue-600 text-white shadow";
                btnCheckout.className = "flex-1 py-2 rounded-md font-semibold text-sm transition text-gray-600";
                checkinFields.style.display = "block";
                idTypeContainer.style.display = "block";
                document.getElementById('nama').required = true;
                document.getElementById('noHp').required = true;
                submitBtn.innerText = "Simpan & Check-In";
                submitBtn.className = "w-full py-3 px-4 rounded-md text-white font-semibold shadow transition bg-blue-600 hover:bg-blue-700 text-sm";
            } else {
                btnCheckout.className = "flex-1 py-2 rounded-md font-semibold text-sm transition bg-red-600 text-white shadow";
                btnCheckin.className = "flex-1 py-2 rounded-md font-semibold text-sm transition text-gray-600";
                checkinFields.style.display = "none";
                idTypeContainer.style.display = "none";
                document.getElementById('nama').required = false;
                document.getElementById('noHp').required = false;
                submitBtn.innerText = "Proses Check-Out";
                submitBtn.className = "w-full py-3 px-4 rounded-md text-white font-semibold shadow transition bg-red-600 hover:bg-red-700 text-sm";
            }
        }

        async function startCamera() {
            const video = document.getElementById('videoElement');
            const cameraContainer = document.getElementById('cameraContainer');
            const startCamBtn = document.getElementById('startCamBtn');
            const captureBtn = document.getElementById('captureBtn');
            const previewContainer = document.getElementById('previewContainer');

            try {
                previewContainer.classList.add('hidden');
                cameraContainer.classList.remove('hidden');
                
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });
                video.srcObject = mediaStream;
                
                startCamBtn.classList.add('hidden');
                captureBtn.classList.remove('hidden');
            } catch (error) {
                console.error("Gagal mengakses kamera:", error);
                showAlert("Tidak dapat mengakses kamera. Periksa izin browser.", "error");
            }
        }

        function capturePhoto() {
            const video = document.getElementById('videoElement');
            const canvas = document.getElementById('canvasElement');
            const cameraContainer = document.getElementById('cameraContainer');
            const previewContainer = document.getElementById('previewContainer');
            const imagePreview = document.getElementById('imagePreview');
            const captureBtn = document.getElementById('captureBtn');
            const retakeBtn = document.getElementById('retakeBtn');

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageDataUrl = canvas.toDataURL('image/jpeg');
            imagePreview.src = imageDataUrl;

            cameraContainer.classList.add('hidden');
            previewContainer.classList.remove('hidden');
            captureBtn.classList.add('hidden');
            retakeBtn.classList.remove('hidden');

            stopCamera();
            processAdvancedOCR(imageDataUrl);
        }

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        function resetCamera() {
            document.getElementById('previewContainer').classList.add('hidden');
            document.getElementById('retakeBtn').classList.add('hidden');
            document.getElementById('startCamBtn').classList.remove('hidden');
            document.getElementById('nik').value = "";
            document.getElementById('nama').value = "";
            document.getElementById('alamat').value = "";
        }

        // --- OCR LANJUTAN DENGAN PATTERNS / REGEX (Lokal di Browser) ---
        async function processAdvancedOCR(imageSource) {
            showAlert("Memindai kartu dan mengekstrak teks (Mohon tunggu sebentar)...", "info");
            const idType = document.getElementById('idType').value;

            try {
                const { data: { text, lines } } = await Tesseract.recognize(imageSource, 'ind', {
                    logger: m => console.log(m)
                });

                console.log("Full OCR Text:\n", text);

                // 1. Ekstraksi Nomor Identitas (NIK / SIM)
                let detectedNumber = "";
                if (idType === 'KTP') {
                    const match = text.match(/\d{16}/);
                    if (match) detectedNumber = match[0];
                } else {
                    const match = text.match(/\d{10,14}/);
                    if (match) {
                        detectedNumber = match[0];
                    } else {
                        const numbersOnly = text.replace(/[^0-9]/g, '');
                        if (numbersOnly.length >= 6) detectedNumber = numbersOnly.substring(0, 16);
                    }
                }
                if (detectedNumber) {
                    document.getElementById('nik').value = detectedNumber;
                }

                // 2. Ekstraksi Nama & Alamat Berdasarkan Label Baris Teks (Heuristik)
                let detectedName = "";
                let detectedAddress = "";

                for (let i = 0; i < lines.length; i++) {
                    let lineText = lines[i].text.trim();
                    let upperLine = lineText.toUpperCase();

                    // Mencari baris yang berada setelah kata kunci "Nama"
                    if ((upperLine.includes("NAMA") || upperLine.includes("NA.MA")) && i + 1 < lines.length) {
                        let nextLine = lines[i + 1].text.trim();
                        // Bersihkan dari sisa label titik dua (misal ": Budi Santoso")
                        detectedName = nextLine.replace(/^[:;.\s]+/, '');
                    }

                    // Mencari baris yang berada setelah kata kunci "Alamat"
                    if ((upperLine.includes("ALAMAT") || upperLine.includes("ALA.MAT")) && i + 1 < lines.length) {
                        let nextLine = lines[i + 1].text.trim();
                        detectedAddress = nextLine.replace(/^[:;.\s]+/, '');
                    }
                }

                // Masukkan hasil ekstraksi ke form jika ditemukan
                if (detectedName && detectedName.length > 2) {
                    document.getElementById('nama').value = detectedName;
                }
                if (detectedAddress && detectedAddress.length > 3) {
                    document.getElementById('alamat').value = detectedAddress;
                }

                showAlert("Pemindaian selesai! Silakan periksa atau sesuaikan data jika ada yang kurang pas.", "success");

            } catch (error) {
                console.error("OCR Error:", error);
                showAlert("Gagal membaca teks dari gambar. Silakan isi form secara manual.", "error");
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Memproses...";

            let payload = {};
            const idType = document.getElementById('idType').value;

            if (currentMode === 'checkin') {
                const currentTime = new Date().toLocaleTimeString();
                payload = {
                    action: "checkin",
                    waktuCheckIn: currentTime,
                    nik: `[${idType}] ` + document.getElementById('nik').value,
                    nama: document.getElementById('nama').value,
                    noHp: document.getElementById('noHp').value,
                    alamat: document.getElementById('alamat').value,
                    keperluan: document.getElementById('keperluan').value
                };
            } else {
                payload = {
                    action: "checkout",
                    nik: document.getElementById('nik').value
                };
            }

            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (currentMode === 'checkin') {
                    showAlert("Check-in berhasil disimpan ke Google Sheets!", "success");
                } else {
                    showAlert("Check-out berhasil dicatat!", "success");
                }
                clearForm();
                resetCamera();
            } catch (error) {
                console.error("Error:", error);
                showAlert("Terjadi kesalahan jaringan saat menyimpan data.", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = currentMode === 'checkin' ? "Simpan & Check-In" : "Proses Check-Out";
            }
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.remove('hidden');
            if (type === 'success') {
                alertBox.className = "p-3 mb-4 rounded-lg text-sm text-center font-medium bg-green-50 text-green-700 border border-green-200";
            } else if (type === 'error') {
                alertBox.className = "p-3 mb-4 rounded-lg text-sm text-center font-medium bg-red-50 text-red-700 border border-red-200";
            } else {
                alertBox.className = "p-3 mb-4 rounded-lg text-sm text-center font-medium bg-blue-50 text-blue-700 border border-blue-200";
            }
            alertBox.innerText = message;
        }

        function hideAlert() {
            document.getElementById('alertBox').classList.add('hidden');
        }

        function clearForm() {
            document.getElementById('receptionForm').reset();
        }
    </script>
</body>
</html>
